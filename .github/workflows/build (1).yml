name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build
        run: |
          S=$(find . -name settings.gradle.kts -not -path "*/node_modules/*" | head -1)
          if [ -z "$S" ]; then echo "settings.gradle.kts nao encontrado. Arquivos no repo:"; find . -maxdepth 3 -not -path "./.git/*"; exit 1; fi
          D=$(dirname "$S")
          echo "Projeto em: $D"
          gradle -p "$D" assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Karthu-apk
          path: "**/app-debug.apk"
